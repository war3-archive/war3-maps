[package]
name = "war3-manager-cli"
version.workspace = true
edition.workspace = true
description = "Archive management for Warcraft III maps: catalog, dataset and release workflow"
homepage.workspace = true
repository.workspace = true
keywords = ["warcraft3", "archive", "catalog"]
categories = ["command-line-utilities"]
license.workspace = true
readme = "../../docs/MANAGER.md"

[[bin]]
name = "war3-manager"
path = "src/main.rs"

[dependencies]
war3parser = { workspace = true, features = ["serde", "carve"] }
clap = { version = "4.5.9", features = ["derive"] }
anyhow = "1.0.95"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10.8"
base64 = "0.22"
image = { workspace = true }

[dev-dependencies]
flate2 = "1.0.27"
