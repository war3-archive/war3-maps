[package]
name = "war3parser"
version.workspace = true
edition.workspace = true
description = "A extractor and parser for Warcraft 3 map files"
documentation = "https://docs.rs/war3parser"
homepage.workspace = true
repository.workspace = true
keywords = ["warcraft3", "MPQ", "parser"]
categories = ["wasm", "command-line-utilities"]
license.workspace = true
readme = "../../docs/PARSER.md"

[dependencies]
base64 = "0.22.1"
flate2 = { version = "1.0.27", optional = true }
image = { workspace = true }
image-blp = { workspace = true }
# Renamed dependency: the fork carries fixes for archives that map protectors
# deliberately malform. It is a workspace member now, so the path is what this
# build uses and the version is what a published war3parser requires.
mpq = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = ["serde", "carve"]
serde = ["dep:serde", "dep:serde_json"]
# Sector-level metadata salvage for unreadable archives. Optional so that
# name-based readers do not pull in an inflate implementation they never call.
carve = ["dep:flate2"]
