name: Release

on:
  push:
    tags:
      - "v*" # v0.9.0, v0.9.1, …

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test

      # The tag is the source of truth: publishing a version that does not match
      # it would put a surprise on crates.io, where versions cannot be deleted.
      - name: Check the tag matches Cargo.toml
        run: |
          manifest=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "tag $tag does not match Cargo.toml version $manifest" >&2
            exit 1
          fi

      - name: Publish
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
