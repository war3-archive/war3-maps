[workspace]
resolver = "2"
members = ["crates/manager-cli"]

[workspace.package]
version = "0.6.0"
edition = "2021"
description = "Archive management for Warcraft III maps: catalog, dataset and release workflow"
homepage = "https://github.com/war3-archive/war3-manager"
repository = "https://github.com/war3-archive/war3-manager"
keywords = ["warcraft3", "archive", "catalog"]
categories = ["command-line-utilities"]
license = "MIT"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Bulk cataloging must survive malformed third-party maps. This profile keeps
# release optimizations while allowing the CLI's per-file catch_unwind boundary
# to record a metadata error and continue with the remaining files.
[profile.catalog]
inherits = "release"
panic = "unwind"

[workspace.dependencies]
image = "0.24.3"
serde = "1.0.204"
serde_json = "1.0.135"

# Parsing lives upstream in war3parser.
war3parser = { version = "0.5.3", features = ["serde", "carve"] }

# TODO: drop this once war3parser 0.5.3 (the `carve` module) is published — the
# relative path only resolves in a checkout that has both repos side by side, so
# any other clone or CI runner cannot build the workspace while it is here.
[patch.crates-io]
war3parser = { path = "../war3parser/crates/core" }
