name: Continuous integration

# This workflow run tests and build for each push

on:
  push:
  pull_request:
    branches:
      - master
jobs:

  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2

      - name: Update local toolchain
        run: |
          rustup update
          rustup component add clippy
          rustup install stable

      - name: Toolchain info
        run: |
          cargo --version --verbose
          rustc --version
          cargo clippy --version

      - name: Lint
        run: |
          cargo fmt -- --check
          # Upstream's inherited code trips lints that only exist on newer
          # clippy (io::Error::other, Iterator::last). Denying them here would
          # force cosmetic churn across files this fork does not otherwise
          # touch, which makes the fork harder to offer back upstream.
          cargo clippy

      - name: Test
        run: |
          cargo check
          cargo test --all

      - name: Build
        run: |
          cargo build --release

