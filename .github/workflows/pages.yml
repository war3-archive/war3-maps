name: Deploy map archive site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
      - ".github/workflows/pages.yml"
  # Covers and objects live in the dataset, so a catalog refresh is the only
  # reason the published site changes without a code change.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build site
        env:
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
          HF_CATALOG_URL: ${{ vars.HF_DATASET_REPO != '' && format('https://huggingface.co/datasets/{0}/resolve/main/catalog/maps.json', vars.HF_DATASET_REPO) || 'https://huggingface.co/datasets/magicwenli/war3-maps/resolve/main/catalog/maps.json' }}
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
